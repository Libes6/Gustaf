<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Scenes are third-party code: no network, and the embedding iframe is sandboxed to an opaque origin. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'unsafe-inline'; worker-src blob:; connect-src 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="wallpaper"></canvas>
    <script src="wallpaper-frame.js"></script>
  </body>
</html>
