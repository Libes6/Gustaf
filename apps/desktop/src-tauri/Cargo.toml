[package]
name = "gustaf"
version = "0.4.0"
description = "Gustaf"
authors = ["Gustaf contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gustaf_lib"
# Desktop only: staticlib/cdylib are for Tauri mobile (the phone app is Expo) and cost ~1 GB per debug build.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dunce = "1.0.5"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-http = { version = "~2.7", features = ["stream"] }
tauri-plugin-dialog = "2.8.0"
tauri-plugin-global-shortcut = "2.4.0"
tauri-plugin-notification = "2"
ignore = "0.4.33"
regex = "1.13.1"
dirs = "7.0.0"
base64 = "0.23.1"
enigo = "0.6.1"
xcap = "0.9.8"
libc = "0.2"
portable-pty = "0.9"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
tauri-plugin-shell = "2.4.0"
# Mobile companion server (src/mobile_server.rs): see docs/features/mobile-server.md for why each one is there.
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
sha2 = "0.10"
subtle = "2"
getrandom = "0.3"
pdf-extract = "0.12"
globset = "0.4.20"

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# Keeps target/ small: line numbers in our own backtraces, no debug info for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
