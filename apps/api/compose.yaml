services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gustaf_cloud
      POSTGRES_USER: gustaf
      POSTGRES_PASSWORD: gustaf_local
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gustaf -d gustaf_cloud"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
