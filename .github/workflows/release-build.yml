name: Gustaf desktop releases

# Push to main: if tag v<version from tauri.conf.json> does not exist yet, build every platform, then tag the
# commit and create a DRAFT release (never published here). If the tag and its release (draft or published)
# exist (docs-only push, no bump), skip. If the tag exists without any release (stray tag), fail.
# Manual run (any branch): build artifacts only, no tag, no draft. Decision logic: scripts/release-plan.mjs.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      signed_macos:
        description: 'Sign and notarize macOS (requires Apple secrets)'
        type: boolean
        default: false

# One release run per ref at a time; a running release is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    # write: `gh release view` only sees DRAFT releases with push access; with read it would report a draft
    # as missing and fail the run as a stray tag. This job only reads (git ls-remote/fetch, gh release view).
    permissions:
      contents: write
    outputs:
      build: ${{ steps.plan.outputs.build }}
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Refuses (fails) unless the push is to main in Libes6/Gustaf and the commit is on origin/main;
      # emits a ::notice:: and build=false when the version tag and its release already exist;
      # fails when the tag exists without a release (stray tag), or when gh cannot tell.
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-plan.mjs

  bundle:
    name: bundle (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-aarch64
          - os: macos-15-intel
            platform: darwin-x86_64
          - os: windows-latest
            platform: windows-x86_64
          - os: ubuntu-24.04
            platform: linux-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify source version
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: node scripts/version.mjs --check ${TAG:+"$TAG"}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          cache-on-failure: true
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev \
            libdbus-1-dev pkg-config libxdo-dev libxcb1-dev libxrandr-dev libgbm-dev libegl-dev \
            libpipewire-0.3-dev libspa-0.2-dev libclang-dev libwayland-dev
      - run: npm ci
      # Needed by the tests below; `tauri build` (beforeBuildCommand: npm run build:release) runs it again, which is
      # cheap from the npm cache and keeps local and CI bundles identical.
      - run: npm --prefix apps/desktop/sidecar ci
      - name: Check source and native tests
        run: |
          node apps/desktop/scripts/check-i18n.mjs
          npm exec -w apps/desktop -- tsc --noEmit
          npm run test:release
          npm test
          npm run test:ui
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml -- --test-threads=1
      - name: Import Developer ID certificate
        if: runner.os == 'macOS' && (inputs.signed_macos || vars.GUSTAF_SIGNED_MACOS == 'true')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_CERTIFICATE" && test -n "$APPLE_CERTIFICATE_PASSWORD" && test -n "$KEYCHAIN_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY" && test -n "$APPLE_ID" && test -n "$APPLE_PASSWORD" && test -n "$APPLE_TEAM_ID"
          case "$APPLE_SIGNING_IDENTITY" in "Developer ID Application:"*) ;; *) echo "Expected a Developer ID Application identity" >&2; exit 1;; esac
          node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP + "/gustaf-cert.p12", Buffer.from(process.env.APPLE_CERTIFICATE, "base64"))'
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/gustaf-build.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/gustaf-build.keychain-db"
          security set-keychain-settings -t 3600 -u "$RUNNER_TEMP/gustaf-build.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/gustaf-build.keychain-db" login.keychain-db
          security import "$RUNNER_TEMP/gustaf-cert.p12" -k "$RUNNER_TEMP/gustaf-build.keychain-db" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/gustaf-build.keychain-db"
          rm -f "$RUNNER_TEMP/gustaf-cert.p12"
      - name: Build distribution bundles
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && (inputs.signed_macos || vars.GUSTAF_SIGNED_MACOS == 'true') && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && (inputs.signed_macos || vars.GUSTAF_SIGNED_MACOS == 'true') && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && (inputs.signed_macos || vars.GUSTAF_SIGNED_MACOS == 'true') && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && (inputs.signed_macos || vars.GUSTAF_SIGNED_MACOS == 'true') && secrets.APPLE_TEAM_ID || '' }}
          GUSTAF_UPDATER_PUBLIC_KEY: ${{ vars.GUSTAF_UPDATER_PUBLIC_KEY || vars.M_CODE_UPDATER_PUBLIC_KEY }}
          GUSTAF_UPDATER_ENDPOINT: https://github.com/Libes6/Gustaf/releases/latest/download/latest.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE: ${{ needs.plan.outputs.release }}
        run: |
          # Keep the config's ad-hoc identity when paid Apple signing is disabled.
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            unset APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          if [ "$RELEASE" = true ] || [ -n "$GUSTAF_UPDATER_PUBLIC_KEY" ]; then
            test -n "$GUSTAF_UPDATER_PUBLIC_KEY" && test -n "$GUSTAF_UPDATER_ENDPOINT" && test -n "$TAURI_SIGNING_PRIVATE_KEY"
            node -e 'const fs=require("fs");const u=process.env.GUSTAF_UPDATER_ENDPOINT;if(!u.startsWith("https://"))throw Error("Updater endpoint must use HTTPS");fs.writeFileSync(process.env.RUNNER_TEMP+"/gustaf-updater.json",JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:process.env.GUSTAF_UPDATER_PUBLIC_KEY,endpoints:[u]}}}))'
            npm run tauri -- build --config "$RUNNER_TEMP/gustaf-updater.json"
          else
            npm run tauri -- build
          fi
      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS' && (inputs.signed_macos || vars.GUSTAF_SIGNED_MACOS == 'true')
        run: |
          codesign --verify --deep --strict --verbose=2 "apps/desktop/src-tauri/target/release/bundle/macos/Gustaf.app"
          spctl --assess --type execute --verbose=2 "apps/desktop/src-tauri/target/release/bundle/macos/Gustaf.app"
          xcrun stapler validate "apps/desktop/src-tauri/target/release/bundle/macos/Gustaf.app"
      - name: Remove temporary signing keychain
        if: always() && runner.os == 'macOS' && (inputs.signed_macos || vars.GUSTAF_SIGNED_MACOS == 'true')
        run: |
          security delete-keychain "$RUNNER_TEMP/gustaf-build.keychain-db" || true
          rm -f "$RUNNER_TEMP/gustaf-cert.p12"
      - name: Stage architecture-specific assets
        env:
          PLATFORM: ${{ matrix.platform }}
        run: node scripts/stage-release.mjs "$PLATFORM"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  draft:
    needs: [plan, bundle]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Create complete manifest and draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          node scripts/version.mjs --check "$TAG"
          # Draft releases do not create their tag, so tag the built commit explicitly. On a re-run the tag may
          # already exist from the failed attempt: accept it only if it points at this exact commit.
          remote=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
          if [ -z "$remote" ]; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          elif [ "$remote" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $TAG already exists on $remote, not on $GITHUB_SHA" >&2
            exit 1
          fi
          # Preserve reviewed notes on a retry; never modify an already public release.
          if gh release view "$TAG" --json isDraft > release-state.json; then
            node -e 'if(!JSON.parse(require("fs").readFileSync("release-state.json")).isDraft)throw Error("Release is already public")'
          else
            gh release create "$TAG" --draft --verify-tag --title "Gustaf $TAG" --generate-notes --target main
          fi
          gh release view "$TAG" --json body --jq .body > release-notes.md
          node scripts/release-manifest.mjs release-assets "${TAG#v}" release-notes.md
          find release-assets -type f -print0 | xargs -0 gh release upload "$TAG" --clobber
          echo "Draft is ready. Review artifacts and notes, then publish manually after approval." >> "$GITHUB_STEP_SUMMARY"
