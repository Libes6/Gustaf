name: Gustaf desktop releases

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      signed_macos:
        description: 'Sign and notarize macOS (requires Apple secrets)'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bundle:
    name: bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-aarch64
          - os: macos-15-intel
            platform: darwin-x86_64
          - os: windows-latest
            platform: windows-x86_64
          - os: ubuntu-22.04
            platform: linux-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify tag and dev ancestry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REPOSITORY" = "Libes6/Gustaf"
            git fetch origin dev
            git merge-base --is-ancestor HEAD FETCH_HEAD
            node scripts/version.mjs --check "$TAG"
          else
            node scripts/version.mjs --check
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev \
            libdbus-1-dev pkg-config libxdo-dev libxcb1-dev libxrandr-dev libgbm-dev libegl-dev \
            libpipewire-0.3-dev libspa-0.2-dev libclang-dev libwayland-dev
      - run: npm ci
      - run: npm --prefix apps/desktop/sidecar ci
      - name: Check source and native tests
        run: |
          node apps/desktop/scripts/check-i18n.mjs
          npm exec -w apps/desktop -- tsc --noEmit
          npm run test:release
          npm test
          npm run test:ui
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml -- --test-threads=1
      - name: Import Developer ID certificate
        if: runner.os == 'macOS' && (inputs.signed_macos || vars.GUSTAF_SIGNED_MACOS == 'true')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_CERTIFICATE" && test -n "$APPLE_CERTIFICATE_PASSWORD" && test -n "$KEYCHAIN_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY" && test -n "$APPLE_ID" && test -n "$APPLE_PASSWORD" && test -n "$APPLE_TEAM_ID"
          case "$APPLE_SIGNING_IDENTITY" in "Developer ID Application:"*) ;; *) echo "Expected a Developer ID Application identity" >&2; exit 1;; esac
          node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP + "/mcode-cert.p12", Buffer.from(process.env.APPLE_CERTIFICATE, "base64"))'
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/mcode-build.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/mcode-build.keychain-db"
          security set-keychain-settings -t 3600 -u "$RUNNER_TEMP/mcode-build.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/mcode-build.keychain-db" login.keychain-db
          security import "$RUNNER_TEMP/mcode-cert.p12" -k "$RUNNER_TEMP/mcode-build.keychain-db" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/mcode-build.keychain-db"
          rm -f "$RUNNER_TEMP/mcode-cert.p12"
      - name: Build distribution bundles
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && (inputs.signed_macos || vars.GUSTAF_SIGNED_MACOS == 'true') && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && (inputs.signed_macos || vars.GUSTAF_SIGNED_MACOS == 'true') && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && (inputs.signed_macos || vars.GUSTAF_SIGNED_MACOS == 'true') && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && (inputs.signed_macos || vars.GUSTAF_SIGNED_MACOS == 'true') && secrets.APPLE_TEAM_ID || '' }}
          M_CODE_UPDATER_PUBLIC_KEY: ${{ vars.M_CODE_UPDATER_PUBLIC_KEY }}
          M_CODE_UPDATER_ENDPOINT: https://github.com/Libes6/Gustaf/releases/latest/download/latest.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Keep the config's ad-hoc identity when paid Apple signing is disabled.
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            unset APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]] || [ -n "$M_CODE_UPDATER_PUBLIC_KEY" ]; then
            test -n "$M_CODE_UPDATER_PUBLIC_KEY" && test -n "$M_CODE_UPDATER_ENDPOINT" && test -n "$TAURI_SIGNING_PRIVATE_KEY"
            node -e 'const fs=require("fs");const u=process.env.M_CODE_UPDATER_ENDPOINT;if(!u.startsWith("https://"))throw Error("Updater endpoint must use HTTPS");fs.writeFileSync(process.env.RUNNER_TEMP+"/mcode-updater.json",JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:process.env.M_CODE_UPDATER_PUBLIC_KEY,endpoints:[u]}}}))'
            npm run tauri -- build --config "$RUNNER_TEMP/mcode-updater.json"
          else
            npm run tauri -- build
          fi
      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS' && (inputs.signed_macos || vars.GUSTAF_SIGNED_MACOS == 'true')
        run: |
          codesign --verify --deep --strict --verbose=2 "apps/desktop/src-tauri/target/release/bundle/macos/Gustaf.app"
          spctl --assess --type execute --verbose=2 "apps/desktop/src-tauri/target/release/bundle/macos/Gustaf.app"
          xcrun stapler validate "apps/desktop/src-tauri/target/release/bundle/macos/Gustaf.app"
      - name: Remove temporary signing keychain
        if: always() && runner.os == 'macOS' && (inputs.signed_macos || vars.GUSTAF_SIGNED_MACOS == 'true')
        run: |
          security delete-keychain "$RUNNER_TEMP/mcode-build.keychain-db" || true
          rm -f "$RUNNER_TEMP/mcode-cert.p12"
      - name: Stage architecture-specific assets
        env:
          PLATFORM: ${{ matrix.platform }}
        run: node scripts/stage-release.mjs "$PLATFORM"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  draft:
    if: startsWith(github.ref, 'refs/tags/')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Create complete manifest and draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/version.mjs --check "$TAG"
          # Preserve reviewed notes on a retry; never modify an already public release.
          if gh release view "$TAG" --json isDraft > release-state.json; then
            node -e 'if(!JSON.parse(require("fs").readFileSync("release-state.json")).isDraft)throw Error("Release is already public")'
          else
            gh release create "$TAG" --draft --title "Gustaf $TAG" --generate-notes --target dev
          fi
          gh release view "$TAG" --json body --jq .body > release-notes.md
          node scripts/release-manifest.mjs release-assets "${TAG#v}" release-notes.md
          find release-assets -type f -print0 | xargs -0 gh release upload "$TAG" --clobber
          echo "Draft is ready. Review artifacts and notes, then publish manually after approval." >> "$GITHUB_STEP_SUMMARY"
