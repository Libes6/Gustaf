name: Inspect first Coolify deployment
on:
  push:
    branches: [gustaf/cloud-api-foundation]
    paths: [".github/workflows/cloud-diagnose.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: cloud-production
    steps:
      - name: Read deployment state
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_DIAGNOSTIC_TOKEN }}
          APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, re
          root = os.environ['COOLIFY_URL'] + '/api/v1/'
          def get(path):
              request = urllib.request.Request(root + path, headers={'Authorization':'Bearer ' + os.environ['COOLIFY_TOKEN']})
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)
          app = get('applications/' + os.environ['APP_UUID'])
          print('APP', json.dumps({k:app.get(k) for k in ['uuid','name','status','fqdn','ports_exposes','docker_registry_image_tag']}))
          deployments = get('deployments/applications/' + os.environ['APP_UUID'])
          if isinstance(deployments, dict):
              deployments = deployments.get('deployments', deployments.get('data', []))
          for d in deployments[:2]:
              print('DEPLOY', json.dumps({k:d.get(k) for k in ['deployment_uuid','status','created_at']}))
              detail = get('deployments/' + d['deployment_uuid'])
              logs = detail.get('logs', [])
              if isinstance(logs, str): logs = json.loads(logs)
              for entry in logs[-80:]:
                  line = entry.get('output', '')
                  if re.search(r'password|postgresql:|DATABASE_URL|token|Authorization|docker run|docker compose| -e ', line, re.I): continue
                  print(line[:400])
          PY
