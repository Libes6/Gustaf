name: Gustaf Cloud API

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".pnpmfile.cjs"
      - "package.json"
      - "patches/**"
      - ".github/workflows/cloud-api.yml"
  push:
    branches: [dev, gustaf/cloud-api-foundation]
    paths:
      - "apps/api/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".pnpmfile.cjs"
      - "package.json"
      - "patches/**"
      - ".github/workflows/cloud-api.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the checked image to Coolify staging (dev branch only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloud-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Image reference
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}/cloud-api" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and run unit tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: gustaf-api:local
          cache-from: type=gha,scope=cloud-api
          cache-to: type=gha,mode=max,scope=cloud-api
      - name: Verify production image with PostgreSQL
        run: |
          docker compose -p cloud-api-ci -f apps/api/compose.image-test.yaml up -d --wait --wait-timeout 90
          docker compose -p cloud-api-ci -f apps/api/compose.image-test.yaml exec -T api node dist/database/migrate.js
          docker compose -p cloud-api-ci -f apps/api/compose.image-test.yaml exec -T api node dist/database/migrate.js
          docker compose -p cloud-api-ci -f apps/api/compose.image-test.yaml stop postgres
          docker compose -p cloud-api-ci -f apps/api/compose.image-test.yaml exec -T api node --input-type=module -e '
            const base = "http://127.0.0.1:3100/health/";
            const ready = await fetch(base + "ready");
            const live = await fetch(base + "live");
            if (ready.status !== 503 || live.status !== 200) process.exit(1);
          '
      - name: Test container logs
        if: failure()
        run: docker compose -p cloud-api-ci -f apps/api/compose.image-test.yaml logs --no-color
      - name: Clean up test containers
        if: always()
        run: docker compose -p cloud-api-ci -f apps/api/compose.image-test.yaml down --volumes
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish checked image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker tag gustaf-api:local "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
          echo "Published: \`$IMAGE:$TAG\` (linux/amd64)" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: cloud-staging
    concurrency:
      group: cloud-api-staging-deploy
      cancel-in-progress: false
    steps:
      - name: Select image and request Coolify deployment
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          IMAGE: ${{ needs.image.outputs.image }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          set -euo pipefail
          : "${COOLIFY_URL:?Set cloud-staging variable COOLIFY_URL}"
          : "${COOLIFY_APP_UUID:?Set cloud-staging variable COOLIFY_APP_UUID}"
          : "${COOLIFY_TOKEN:?Set cloud-staging secret COOLIFY_TOKEN}"
          [[ "$COOLIFY_URL" == https://* ]] || { echo "COOLIFY_URL must use HTTPS"; exit 1; }
          [[ "$COOLIFY_APP_UUID" =~ ^[a-zA-Z0-9_-]+$ ]] || exit 1
          API="${COOLIFY_URL%/}/api/v1"
          BODY=$(jq -nc --arg image "$IMAGE" --arg tag "$TAG" '{docker_registry_image_name:$image,docker_registry_image_tag:$tag}')
          curl --silent --show-error --fail --connect-timeout 10 --max-time 60 \
            --request PATCH "$API/applications/$COOLIFY_APP_UUID" \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            --header 'Content-Type: application/json' --data "$BODY" --output /dev/null
          curl --silent --show-error --fail --connect-timeout 10 --max-time 60 \
            "$API/deploy?uuid=$COOLIFY_APP_UUID&force=false" \
            --header "Authorization: Bearer $COOLIFY_TOKEN" --output /dev/null
          echo "Coolify accepted deployment request for \`$IMAGE:$TAG\`. Verify completion in Coolify deployment logs and /health/ready." >> "$GITHUB_STEP_SUMMARY"

  inspect-coolify:
    if: github.ref == 'refs/heads/gustaf/cloud-api-foundation' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: cloud-staging
    steps:
      - name: Inspect available Coolify resources
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          python3 - <<'PYCODE'
          import os, json, urllib.request, urllib.error
          base = os.environ["COOLIFY_URL"].rstrip("/") + "/api/v1/"
          for endpoint in ["version", "projects", "servers", "databases", "applications"]:
              request = urllib.request.Request(base + endpoint, headers={"Authorization": "Bearer " + os.environ["COOLIFY_TOKEN"]})
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      raw = response.read().decode()
              except urllib.error.HTTPError as error:
                  message = error.read().decode().replace(os.environ["COOLIFY_TOKEN"], "[redacted]")
                  print(endpoint, "HTTP", error.code, message[:500])
                  raise SystemExit(1)
              data = raw if endpoint == "version" else json.loads(raw)
              if isinstance(data, list):
                  print(endpoint, json.dumps([{key: row.get(key) for key in ["uuid", "name", "status", "environment_id", "destination_id"]} for row in data]))
              else:
                  print(endpoint, data if endpoint == "version" else list(data.keys()))
          PYCODE
