name: CI

on:
  push:
    branches: [dev, main]
    # Docs-only changes skip CI; any change outside these globs (code, workflows, lockfiles) still runs it.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'TASKS.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'TASKS.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'

# A newer push to the same branch (or new commits on the same PR) cancels the older in-progress run,
# so merging several PRs into dev in a row fully checks only the latest dev head. Cancelled runs are expected.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        # Tauri (WebKitGTK), keyring (D-Bus Secret Service), enigo/xcap (X11, PipeWire capture).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev \
            libdbus-1-dev pkg-config libxdo-dev libxcb1-dev libxrandr-dev libgbm-dev libegl-dev \
            libpipewire-0.3-dev libspa-0.2-dev libclang-dev libwayland-dev
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - run: npm --prefix apps/desktop/sidecar ci
      - run: node apps/desktop/scripts/build-canvas.mjs
      # i18n check, tsc, node tests and `cargo test` (the Rust tests include per-OS shell and path logic).
      - run: npm run check
      # Failure artifacts of npm run test:e2e (screenshots, Playwright traces, backend call log); the suite itself runs inside
      # `npm run check` and skips itself with a message when no Chrome is found (macOS and Linux runners have one; the Windows paths are not probed).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failures
          path: apps/desktop/tests/e2e/artifacts
          if-no-files-found: ignore

  # The mobile app is not an npm workspace (own React/React Native, own lockfile): typecheck and unit tests only, Linux only.
  # Does not gate the desktop matrix; no native build or simulator runs here.
  mobile:
    name: mobile (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
