name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm --prefix sidecar ci
      - run: node scripts/build-canvas.mjs
      - run: npm run check
      # Failure artifacts of npm run test:e2e (screenshots, Playwright traces, backend call log); the suite itself runs inside
      # `npm run check` and skips itself with a message when no Chrome is installed (the macOS runners have one).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failures
          path: tests/e2e/artifacts
          if-no-files-found: ignore
