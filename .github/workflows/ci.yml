name: Gustaf Tauri

# A pull request builds one platform. The full set runs only for a release tag
# or a manual run, so a release no longer pays for it on dev and main as well.
# A push to dev only compiles the Rust crates and saves the cache: a cache saved
# by a pull request or a tag is invisible to other runs, one saved on dev is not.
on:
  pull_request:
  push:
    branches: [dev]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gustaf-tauri-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Untranslated interface copy may only go down; see the top of scripts/i18n-audit.mjs.
  i18n-audit:
    name: i18n audit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - run: node --test scripts/i18n-audit.test.mjs
      - run: node scripts/i18n-audit.mjs --check

  warm-cache:
    name: Warm Rust cache (${{ matrix.platform }})
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, platform: darwin-aarch64 }
          - { runner: windows-2025, platform: windows-x86_64 }
          - { runner: ubuntu-24.04, platform: linux-x86_64 }
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # Same shared-key and workspaces as the bundle job, or the two would not share a cache.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/shell/src-tauri
            native/resource-monitor
          shared-key: gustaf-${{ matrix.platform }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: apps/shell/scripts/install-linux-deps.sh
      # The same profile and features the bundle job compiles with.
      - run: cargo test --locked --release --no-run --manifest-path apps/shell/src-tauri/Cargo.toml
      - run: cargo build --locked --release --bins --features tauri/custom-protocol --manifest-path apps/shell/src-tauri/Cargo.toml
      - run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml

  bundle:
    name: Bundle (${{ matrix.platform }})
    if: github.ref != 'refs/heads/dev' || github.event_name != 'push'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"runner":"macos-15","platform":"darwin-aarch64","bundles":"app,dmg"}]' || '[{"runner":"macos-15","platform":"darwin-aarch64","bundles":"app,dmg"},{"runner":"windows-2025","platform":"windows-x86_64","bundles":"nsis,msi"},{"runner":"ubuntu-24.04","platform":"linux-x86_64","bundles":"deb,appimage,rpm"}]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      # Restores what warm-cache saved on dev. Only dev saves: a cache saved here is scoped
      # to this pull request or tag, costs half a minute and fills the repository quota.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/shell/src-tauri
            native/resource-monitor
          shared-key: gustaf-${{ matrix.platform }}
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: apps/shell/scripts/install-linux-deps.sh
      - run: pnpm install --frozen-lockfile
      - run: node --test packages/provider-ollama/src/http.test.ts
      - run: node --test apps/shell/tests/*.test.mjs
      # --release: shares every compiled dependency with the bundle below instead of building them twice.
      - run: cargo test --locked --release --manifest-path apps/shell/src-tauri/Cargo.toml
      # The server and web report their package version, which `gustaf update`, SSH hosts and the
      # CLI archive names use, so it must be the app's. The repository keeps T3's 0.1.7 there.
      - name: Stamp the app version into the server and web packages
        run: node apps/shell/scripts/stamp-version.mjs
      - name: Build T3 and bundle Gustaf
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: ${{ runner.os == 'Linux' && 'true' || '' }}
          BUNDLES: ${{ matrix.bundles }}
          GUSTAF_UPDATER_PUBLIC_KEY: ${{ vars.GUSTAF_UPDATER_PUBLIC_KEY || vars.M_CODE_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          set --
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test -n "$TAURI_SIGNING_PRIVATE_KEY"
            test -n "$GUSTAF_UPDATER_PUBLIC_KEY"
            node -e 'require("node:fs").writeFileSync(process.argv[1], JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:process.env.GUSTAF_UPDATER_PUBLIC_KEY}}}))' "$RUNNER_TEMP/gustaf-release.json"
            set -- --config "$RUNNER_TEMP/gustaf-release.json"
          fi
          if [[ "$RUNNER_OS" == Linux ]]; then
            set -- "$@" --verbose
          fi
          pnpm --filter @gustaf/shell build --bundles "$BUNDLES" "$@"
      # WebKit needs the appsink plugin for audio and video; the host's plugins are not searched.
      - name: Check the AppImage ships GStreamer plugins
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(ls "$GITHUB_WORKSPACE"/apps/shell/src-tauri/target/release/bundle/appimage/*.AppImage)
          cd "$RUNNER_TEMP"
          "$appimage" --appimage-extract >/dev/null
          find squashfs-root -path '*gstreamer-1.0/libgstapp.so' | grep -q .
      # Only a browser sees a client that dies while its modules load.
      - name: Check the bundled web app starts
        run: node apps/shell/scripts/smoke-runtime.mjs
      - name: Collect installers
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: node apps/shell/scripts/stage-release.mjs "$PLATFORM"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
      # build:runtime leaves the `gustaf` CLI archive it bundled in release/gustaf-cli.
      - name: Check the CLI archive unpacks and runs
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./apps/shell/src-tauri/tauri.conf.json").version')
          shopt -s nullglob
          archives=(release/gustaf-cli/gustaf-"$version"-*)
          test "${#archives[@]}" -eq 1
          node scripts/smoke-cli-archive.ts --archive "${archives[0]}" --expect-version "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}
          path: release/gustaf-cli/*
          if-no-files-found: error

  release:
    name: Publish Gustaf
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'Libes6/Gustaf'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
      - name: Group assets by platform
        run: |
          mkdir release-assets
          for dir in downloaded/installers-*; do mv "$dir" "release-assets/${dir##*/installers-}"; done
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
          version=$(jq -er .version apps/shell/src-tauri/tauri.conf.json)
          test "$GITHUB_REF_NAME" = "v$version"
          mapfile -t installers < <(find release-assets -type f -print | sort)
          test "${#installers[@]}" -eq 13
          # The `gustaf` CLI for each desktop platform; cliArchiveFileName in packages/shared/src/cliRelease.ts.
          mapfile -t archives < <(find downloaded -path 'downloaded/cli-*' -type f -print | sort)
          test "${#archives[@]}" -eq 3
          for archive in "${archives[@]}"; do
            [[ "${archive##*/}" =~ ^gustaf-$version-(darwin-arm64\.tar\.gz|linux-x64\.tar\.gz|win32-x64\.zip)$ ]]
          done
          previous=$(git describe --tags --abbrev=0 --match 'v*.*.*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          node apps/shell/scripts/release-notes.mjs "$version" "$previous" "$RUNNER_TEMP/release-notes.md"
          node apps/shell/scripts/release-manifest.mjs release-assets "$version" "$RUNNER_TEMP/release-notes.md"
          mkdir publish
          cp "${installers[@]}" "${archives[@]}" release-assets/latest.json publish/
          (cd publish && sha256sum -- * > SHA256SUMS.txt)
          if state=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            test "$state" = true
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Gustaf $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber publish/*
          gh release edit "$GITHUB_REF_NAME" --draft=false
      # A release published with GITHUB_TOKEN fires no `release` event, so start the APK build directly.
      - name: Build the Android APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mobile-android-release.yml -R "$GITHUB_REPOSITORY" -f tag="$GITHUB_REF_NAME"
