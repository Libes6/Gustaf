name: Gustaf Tauri

on:
  pull_request:
  push:
    branches: [dev, main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gustaf-tauri-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  bundle:
    name: Bundle (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, platform: darwin-aarch64, bundles: "app,dmg" }
          - { runner: macos-15-intel, platform: darwin-x86_64, bundles: "app,dmg" }
          - { runner: windows-2025, platform: windows-x86_64, bundles: "nsis,msi" }
          - { runner: ubuntu-24.04, platform: linux-x86_64, bundles: "deb,appimage,rpm" }
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/shell/src-tauri
          key: ${{ matrix.platform }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libdbus-1-dev libxcb1-dev libxrandr-dev libgbm-dev libegl-dev libwayland-dev \
            libpipewire-0.3-dev libspa-0.2-dev patchelf libatomic1 xvfb rpm
      - run: pnpm install --frozen-lockfile
      - run: node --test packages/provider-ollama/src/http.test.ts
      - run: cargo test --locked --manifest-path apps/shell/src-tauri/Cargo.toml
      - name: Build T3 and bundle Gustaf
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: ${{ runner.os == 'Linux' && 'true' || '' }}
          BUNDLES: ${{ matrix.bundles }}
          GUSTAF_UPDATER_PUBLIC_KEY: ${{ vars.GUSTAF_UPDATER_PUBLIC_KEY || vars.M_CODE_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          set --
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test -n "$TAURI_SIGNING_PRIVATE_KEY"
            test -n "$GUSTAF_UPDATER_PUBLIC_KEY"
            node -e 'require("node:fs").writeFileSync(process.argv[1], JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:process.env.GUSTAF_UPDATER_PUBLIC_KEY}}}))' "$RUNNER_TEMP/gustaf-release.json"
            set -- --config "$RUNNER_TEMP/gustaf-release.json"
          fi
          if [[ "$RUNNER_OS" == Linux ]]; then
            set -- "$@" --verbose
          fi
          pnpm --filter @gustaf/shell build --bundles "$BUNDLES" "$@"
      - name: Collect installers
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: node apps/shell/scripts/stage-release.mjs "$PLATFORM"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish Gustaf
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'Libes6/Gustaf'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
      - name: Group assets by platform
        run: |
          mkdir release-assets
          for dir in downloaded/installers-*; do mv "$dir" "release-assets/${dir##*/installers-}"; done
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
          version=$(jq -er .version apps/shell/src-tauri/tauri.conf.json)
          test "$GITHUB_REF_NAME" = "v$version"
          mapfile -t installers < <(find release-assets -type f -print | sort)
          test "${#installers[@]}" -eq 16
          node apps/shell/scripts/release-manifest.mjs release-assets "$version"
          mkdir publish
          cp "${installers[@]}" release-assets/latest.json publish/
          (cd publish && sha256sum -- * > SHA256SUMS.txt)
          if state=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            test "$state" = true
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Gustaf $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber publish/*
          gh release edit "$GITHUB_REF_NAME" --draft=false
